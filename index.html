<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瑞鵬 & 貞吟 婚禮邀請函</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="invitation-card">
    <img src="images/photo9.png" alt="主視覺婚紗照" class="hero-img">

    <!-- 橫向輪播相簿區 -->
    <section class="section">
      <h2>Our Wedding Photos</h2>
      <p class="album-hint">‹ 左右滑動查看照片 ›</p>
      <div class="album-carousel">
        <img src="images/photo1.jpg" alt="婚紗照 1">
        <img src="images/photo2.jpg" alt="婚紗照 2">
        <img src="images/photo3.jpg" alt="婚紗照 3">
        <img src="images/photo4.jpg" alt="婚紗照 4">
        <img src="images/photo5.jpg" alt="婚紗照 5">
      </div>
    </section>

    <!-- 婚禮與婚宴資訊 -->
    <section class="section">
      <h2>婚宴資訊</h2>
      <p class="time"><strong>時間：</strong>2026 年 11 月 7 日 (六) 12:00</p>
      <p class="location"><strong>地點：</strong>捷絲旅 臺南虎山館 Good Time 鼓時光宴會廳</p>
      <p class="address">台南市仁德區文華路二段300號10樓</p>
    </section>

    <!-- Google 地圖導航 -->
    <section class="section">
      <h2>婚宴地點導航</h2>
      <div class="map-container">
        <iframe
          src="https://maps.google.com/maps?q=台南市仁德區文華路二段300號&amp;output=embed"
          width="100%"
          height="220"
          style="border:0;"
          allowfullscreen=""
          loading="lazy">
        </iframe>
      </div>
      <a class="btn btn-outline" href="https://maps.app.goo.gl/WFR496NyzEuJFRc66" target="_blank">開啟 Google 地圖導航</a>
    </section>

    <!-- 婚禮音樂 -->
    <section class="section">
      <h2>Wedding Music</h2>
      <audio class="wedding-audio" controls loop preload="none">
        <source src="music.mp3" type="audio/mpeg">
        您的瀏覽器不支援音訊播放。
      </audio>
    </section>
  </main>
</body>
</html>
